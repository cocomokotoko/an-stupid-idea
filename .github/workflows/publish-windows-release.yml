name: Publish Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist:win
      - name: Publish GitHub release with updater metadata
        uses: softprops/action-gh-release@v2
        with:
          name: My app space ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/My-app-space-Setup.exe
            dist/latest.yml
            dist/*.blockmap
